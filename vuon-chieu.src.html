<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vườn Chiều Lặng Gió</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Mali:wght@500;600;700&display=swap"
/>
<style>
  /* Layout: a voxel garden diorama fills the screen; a wooden "inventory" diary sits on the right (bottom sheet on phones). */
  :root {
    --sky-top: #93c8f0;
    --sky-mid: #f6cbd8;
    --sky-low: #ffe0b4;
    --panel: #fff7e8;
    --panel-2: #f1e1c4;
    --edge: #6b4a2f;
    --ink: #3a2a1c;
    --muted: #7a6450;
    --grass: #5c9d3a;
    --grass-soft: #e5f1d6;
    --pink: #d9567f;
    --drop: rgba(70, 40, 20, 0.28);
    --display: "Mali", "Be Vietnam Pro", system-ui, sans-serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    --panel-w: 380px;
    --peek: 144px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #0a0f2e;
      --sky-mid: #262a5e;
      --sky-low: #4b3b6e;
      --panel: #222948;
      --panel-2: #181e38;
      --edge: #0b0f24;
      --ink: #f1eefc;
      --muted: #b5b1d2;
      --grass: #9fe07c;
      --grass-soft: rgba(159, 224, 124, 0.14);
      --pink: #ff9fc0;
      --drop: rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky-top: #0a0f2e;
    --sky-mid: #262a5e;
    --sky-low: #4b3b6e;
    --panel: #222948;
    --panel-2: #181e38;
    --edge: #0b0f24;
    --ink: #f1eefc;
    --muted: #b5b1d2;
    --grass: #9fe07c;
    --grass-soft: rgba(159, 224, 124, 0.14);
    --pink: #ff9fc0;
    --drop: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  [hidden] {
    display: none !important;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--sky-mid);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.6;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 3px solid var(--grass);
    outline-offset: 2px;
  }

  /* ---------- sky ---------- */
  #stage {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 58%, var(--sky-low) 100%);
    transition: background 1.2s ease;
  }
  .sky-stars {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.4s ease;
    background-image: radial-gradient(2px 2px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 28% 8%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 44% 22%, #ffe9b0 50%, transparent 51%),
      radial-gradient(2px 2px at 61% 12%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 77% 26%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 89% 9%, #cfe3ff 50%, transparent 51%), radial-gradient(2px 2px at 6% 38%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 35% 36%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 70% 40%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 95% 34%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 52% 4%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 18% 30%, #ffe9b0 50%, transparent 51%);
  }
  .sky-orb {
    position: absolute;
    top: 13%;
    left: 9%;
    width: 64px;
    height: 64px;
    background: #fff4c9;
    box-shadow: 0 0 0 10px rgba(255, 236, 170, 0.35), 0 0 80px 40px rgba(255, 214, 150, 0.55);
    transition: background 1.2s ease, box-shadow 1.2s ease;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sky-stars {
      opacity: 1;
    }
    :root:not([data-theme="light"]) .sky-orb {
      background: #eef0ff;
      box-shadow: 0 0 0 8px rgba(220, 225, 255, 0.18), 0 0 60px 20px rgba(170, 180, 255, 0.25);
    }
  }
  :root[data-theme="dark"] .sky-stars {
    opacity: 1;
  }
  :root[data-theme="dark"] .sky-orb {
    background: #eef0ff;
    box-shadow: 0 0 0 8px rgba(220, 225, 255, 0.18), 0 0 60px 20px rgba(170, 180, 255, 0.25);
  }
  #garden {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  #garden.grabbing {
    cursor: grabbing;
  }
  #garden.pointing {
    cursor: pointer;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0 24px;
    text-align: center;
    font-family: var(--display);
    font-size: 18px;
    color: var(--ink);
  }

  /* ---------- pixel panels ---------- */
  .px {
    background: var(--panel);
    border: 3px solid var(--edge);
    border-radius: 6px;
    box-shadow: inset 0 -4px 0 var(--panel-2), 0 5px 0 var(--drop);
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 0;
    pointer-events: none;
  }
  .topbar > * {
    pointer-events: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px 9px 9px;
    min-width: 0;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    flex: none;
    image-rendering: pixelated;
    border-radius: 4px;
    background: var(--panel-2);
  }
  .brand h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.1;
    text-wrap: balance;
  }
  .brand p {
    margin: 1px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.3;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .ctl {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 15px 0 12px;
    cursor: pointer;
    font-family: var(--display);
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .ctl:hover {
    background: var(--panel-2);
  }
  .ctl:active {
    transform: translateY(3px);
    box-shadow: inset 0 -2px 0 var(--panel-2), 0 2px 0 var(--drop);
  }
  .ctl[aria-pressed="true"] {
    background: var(--grass-soft);
  }
  .ctl svg {
    width: 18px;
    height: 18px;
    flex: none;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(calc(-50% - var(--hint-shift, 0px)));
    z-index: 3;
    margin: 0;
    width: max-content;
    max-width: calc(100% - 32px);
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .hint.faded {
    opacity: 0;
  }

  .tip,
  .bubble {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 6;
    pointer-events: none;
  }
  .tip {
    padding: 2px 10px;
    font-family: var(--display);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .bubble {
    padding: 8px 14px;
    max-width: min(280px, calc(100vw - 32px));
    font-family: var(--display);
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
    animation: pop 0.3s cubic-bezier(0.2, 1.5, 0.4, 1);
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -12px;
    width: 12px;
    height: 12px;
    background: var(--panel);
    border-right: 3px solid var(--edge);
    border-bottom: 3px solid var(--edge);
    transform: translateX(-50%) rotate(45deg);
  }
  @keyframes pop {
    from {
      scale: 0.5;
      opacity: 0;
    }
  }

  /* ---------- diary ---------- */
  .diary {
    position: fixed;
    z-index: 4;
    top: calc(92px + env(safe-area-inset-top, 0px));
    right: 20px;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: var(--panel-w);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
  }
  .diary:not(.open) {
    transform: translateX(calc(100% + 40px));
    opacity: 0;
    pointer-events: none;
  }
  .diary-head {
    padding: 16px 18px 14px;
    border-bottom: 3px solid var(--panel-2);
    display: grid;
    gap: 9px;
  }
  .diary-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .diary h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
  }
  .sample-note {
    font-size: 12px;
    color: var(--muted);
  }
  .handle {
    display: none;
  }
  .friends-label {
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .friends {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    padding: 3px 10px 4px;
    font-size: 13px;
    font-weight: 500;
    background: var(--grass-soft);
    border: 2px solid var(--edge);
    border-radius: 4px;
    box-shadow: 0 2px 0 var(--drop);
    cursor: pointer;
  }
  .chip:hover {
    background: var(--panel-2);
  }
  .chip:active {
    transform: translateY(2px);
    box-shadow: none;
  }
  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 10px 18px;
    overscroll-behavior: contain;
  }
  .post-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 4px;
  }
  .post-btn {
    width: 100%;
    display: grid;
    gap: 2px;
    padding: 11px 12px 12px;
    text-align: left;
    background: none;
    border: 2px solid transparent;
    border-radius: 6px;
    cursor: pointer;
  }
  .post-btn:hover,
  .post-btn.flash {
    background: var(--grass-soft);
    border-color: var(--panel-2);
  }
  .meta {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .meta b {
    font-weight: 600;
    color: var(--pink);
  }
  .post-btn .t {
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
    line-height: 1.25;
    text-wrap: balance;
  }
  .post-btn .ex {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .reader {
    padding: 4px 12px 10px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    margin-left: -4px;
    font-size: 13px;
    font-weight: 500;
    background: var(--grass-soft);
    border: 2px solid var(--edge);
    border-radius: 4px;
    cursor: pointer;
  }
  .reader h3 {
    margin: 12px 0 4px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 25px;
    line-height: 1.2;
    text-wrap: balance;
  }
  .reader .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin: 0 0 14px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .reader p {
    margin: 0 0 12px;
    max-width: 62ch;
  }

  @media (max-width: 760px) {
    .topbar {
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
    }
    .brand {
      padding: 6px 12px 6px 6px;
      gap: 9px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
    }
    .brand h1 {
      font-size: 18px;
    }
    .brand p {
      display: none;
    }
    .ctl {
      width: 46px;
      padding: 0;
      justify-content: center;
    }
    .ctl .lbl {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    #btn-diary {
      display: none;
    }
    .diary {
      top: auto;
      left: 16px;
      right: 16px;
      width: auto;
      height: min(64%, 560px);
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .diary:not(.open) {
      transform: translateY(calc(100% - var(--peek)));
      opacity: 1;
      pointer-events: auto;
    }
    .diary:not(.open) .scroll {
      visibility: hidden;
    }
    .diary-head {
      padding: 8px 14px 12px;
    }
    .handle {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 0;
      background: none;
      border: 0;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
    }
    .handle::before {
      content: "";
      width: 40px;
      height: 5px;
      border-radius: 2px;
      background: var(--panel-2);
    }
    .diary h2 {
      font-size: 22px;
    }
    .hint {
      display: none;
    }
    .sky-orb {
      width: 44px;
      height: 44px;
      top: 16%;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .diary,
    .bubble,
    .ctl,
    #stage,
    .sky-stars {
      transition: none;
      animation: none;
    }
  }
</style>

<div id="stage">
  <canvas
    id="garden"
    aria-label="Khu vườn voxel: căn nhà gỗ nhỏ, cây anh đào, luống rau, ao cá; chủ vườn đi tưới cây cùng mèo, cún, gà và thỏ"
  ></canvas>
  <p id="loading">Đang dựng khu vườn…</p>
</div>
<div id="tip" class="tip px" hidden></div>
<div id="bubble" class="bubble px" hidden></div>

<header class="topbar">
  <div class="brand px">
    <canvas class="brand-mark" id="brand-mark" width="32" height="32" aria-hidden="true"></canvas>
    <div>
      <h1>Vườn Chiều Lặng Gió</h1>
      <p>nhật ký những ngày chậm rãi</p>
    </div>
  </div>
  <div class="controls">
    <button id="btn-sound" class="ctl px" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
        <path d="M9 18V6l10-2v12" />
        <rect x="4" y="15" width="5" height="5" />
        <rect x="14" y="13" width="5" height="5" />
      </svg>
      <span class="lbl">Bật nhạc</span>
    </button>
    <button id="btn-time" class="ctl px" type="button">
      <svg id="ico-time" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"></svg>
      <span class="lbl">Trời tối</span>
    </button>
    <button id="btn-diary" class="ctl px" type="button" aria-pressed="true" aria-controls="diary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
        <path d="M5 4h11l3 3v13H5Z" />
        <path d="M9 9h6M9 13h6" />
      </svg>
      <span class="lbl">Nhật ký</span>
    </button>
  </div>
</header>

<p id="hint" class="hint px">Chạm vào mọi thứ trong vườn · kéo để xoay · lăn để phóng to</p>

<aside id="diary" class="diary px open" aria-label="Nhật ký">
  <div class="diary-head">
    <button id="handle" class="handle" type="button" aria-controls="diary" aria-expanded="false">Kéo lên để đọc nhật ký</button>
    <div class="diary-title">
      <h2>Nhật ký</h2>
      <span class="sample-note">8 bài · bài mẫu</span>
    </div>
    <p class="friends-label">Trong vườn có</p>
    <div class="friends" id="friends"></div>
  </div>
  <div class="scroll" id="scroll">
    <ul class="post-list" id="list"></ul>
    <article class="reader" id="reader" hidden></article>
  </div>
</aside>

  const Sound = {
    ctx: null,

    init() {
      if (this.ctx) return true;
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return false;
      const ctx = (this.ctx = new C());
      this.master = ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(ctx.destination);
      this.bus = ctx.createGain();
      this.bus.connect(this.master);

      delay.delayTime.value = 0.36;
      const fb = ctx.createGain();
      fb.gain.value = 0.3;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 2200;
      const wet = ctx.createGain();
      wet.gain.value = 0.3;
      this.bus.connect(wet);
      wet.connect(delay);
      delay.connect(lp);
      lp.connect(fb);
      fb.connect(delay);
      lp.connect(this.master);
      return true;
    },
    tone(freq, when, { type = "sine", gain = 0.1, attack = 0.01, release = 0.3, glide = null } = {}) {
      const ctx = this.ctx;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, when);
      if (glide) glide(o.frequency, when);
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(gain, when + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, when + attack + release);
      o.connect(g);
      g.connect(this.bus);
      o.start(when);
      o.stop(when + attack + release + 0.05);
    },
    later(fn, ms) {
      const id = setTimeout(() => {
        this.timers = this.timers.filter((x) => x !== id);
        if (this.on) fn();
      }, ms);
      this.timers.push(id);
    },
    note(m) {
      return 440 * Math.pow(2, (m - 69) / 12);
    },
    pad(i = 0) {
      const chords = [
        [53, 57, 60, 64],
        [55, 59, 62, 65],
        [52, 55, 59, 62],
        [50, 53, 57, 60],
      ];
      const now = this.ctx.currentTime;
      chords[i % 4].forEach((m, j) => {
        const f = this.note(m - (isNight() ? 12 : 0));
        for (const d of [-0.003, 0.003]) this.tone(f * (1 + d), now + j * 0.08, { gain: 0.02, attack: 2.2, release: 5.5 });
      });
      this.later(() => this.pad(i + 1), 6400);
    },
    melody() {
      const scale = [72, 74, 76, 79, 81, 84, 86, 88];
      const m = scale[Math.floor(Math.random() * scale.length)] - (isNight() ? 12 : 0);
      const now = this.ctx.currentTime;
      this.tone(this.note(m), now, { type: "triangle", gain: 0.045, attack: 0.005, release: 1.2 });
      this.tone(this.note(m) * 2, now, { gain: 0.012, attack: 0.003, release: 0.4 });
      this.later(() => this.melody(), 700 + Math.random() * 2300);
    },
    nature() {
      const now = this.ctx.currentTime;
      if (isNight()) {
        for (let i = 0; i < 6; i++) this.tone(4300, now + i * 0.055, { type: "triangle", gain: 0.01, attack: 0.004, release: 0.03 });
      } else {
        const base = 2600 + Math.random() * 1400;
        for (let i = 0; i < 3; i++) this.tone(base, now + i * 0.11, { gain: 0.03, attack: 0.005, release: 0.07, glide: (p, w) => p.exponentialRampToValueAtTime(base * 1.4, w + 0.06) });
      }

    },
    sfx(name) {
      if (!this.on || !this.ctx) return;
      const now = this.ctx.currentTime;
      const t = (f, w, o) => this.tone(f, now + w, o);
      if (name === "cat") {
        t(520, 0, { type: "sawtooth", gain: 0.03, attack: 0.05, release: 0.5, glide: (p, w) => { p.linearRampToValueAtTime(780, w + 0.18); p.linearRampToValueAtTime(470, w + 0.5); } });
        t(1040, 0, { gain: 0.02, attack: 0.05, release: 0.45 });
      } else if (name === "dog") {
        for (const w of [0, 0.22]) t(340, w, { type: "square", gain: 0.028, attack: 0.005, release: 0.12, glide: (p, x) => p.exponentialRampToValueAtTime(190, x + 0.11) });
      } else if (name === "chicken") {
        [0, 0.12, 0.24, 0.45].forEach((w, i) => t(i === 3 ? 900 : 620, w, { type: "square", gain: 0.02, attack: 0.004, release: i === 3 ? 0.25 : 0.06, glide: (p, x) => p.exponentialRampToValueAtTime(i === 3 ? 520 : 480, x + 0.08) }));
      } else if (name === "fish") {
        t(620, 0, { gain: 0.08, attack: 0.004, release: 0.22, glide: (p, w) => p.exponentialRampToValueAtTime(180, w + 0.2) });

        t(500, 0, { gain: 0.06, attack: 0.004, release: 0.12, glide: (p, w) => p.exponentialRampToValueAtTime(1100, w + 0.1) });
      } else {
        [84, 88, 91, 96].forEach((m, i) => t(this.note(m), i * 0.06, { gain: 0.03, attack: 0.003, release: 0.9 }));
      }
    },
    toggle() {
      if (!this.init()) return false;
      this.on = !this.on;
      const g = this.master.gain;
      const now = this.ctx.currentTime;
      g.cancelScheduledValues(now);

      } else {
        g.linearRampToValueAtTime(0, now + 0.6);
        this.timers.forEach(clearTimeout);
        this.timers = [];
      }
      return this.on;
    },
  };

  /* ---------- water ---------- */
  const waterTex = pixTex(IMG.water, { wrap: true });

  const pondW = POND.x1 - POND.x0 + 1;
  const pondD = POND.z1 - POND.z0 + 1;
  const waterMat = new THREE.ShaderMaterial({
    transparent: true,
    uniforms: { map: { value: waterTex }, uTime: { value: 0 }, uNight: { value: 0 }, uRep: { value: new THREE.Vector2(pondW, pondD) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform sampler2D map; uniform float uTime, uNight; uniform vec2 uRep;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        vec2 uv = vUv * uRep + vec2(sin(uTime * 0.3) * 0.08, uTime * 0.035);
        vec3 tex = texture2D(map, uv).rgb;
        vec3 tint = mix(vec3(0.75, 0.98, 1.08), vec3(0.18, 0.24, 0.5), uNight);
        vec3 deep = mix(vec3(0.05, 0.28, 0.45), vec3(0.01, 0.03, 0.12), uNight);
        vec3 col = mix(tex * tint, deep, 0.28);
        float edge = min(min(vUv.x, 1.0 - vUv.x) * uRep.x, min(vUv.y, 1.0 - vUv.y) * uRep.y);
        col += smoothstep(0.32, 0.0, edge) * 0.35 * (1.0 - uNight * 0.6);
        vec2 cell = floor(vUv * uRep * 14.0 + vec2(0.0, floor(uTime * 0.5)));
        float h = h21(cell);
        col += vec3(1.0, 0.92, 0.8) * step(0.955, h) * pow(max(0.0, sin(uTime * 3.0 + h * 50.0)), 10.0) * 2.5;
        gl_FragColor = vec4(col, 0.88);
      }`,
  });
  const water = new THREE.Mesh(new THREE.PlaneGeometry(pondW, pondD), waterMat);
  water.rotation.x = -Math.PI / 2;

      void main(){
        vec2 uv = vUv;
        vec3 top = mix(vec3(0.30, 0.58, 0.96), vec3(0.03, 0.05, 0.16), uNight);
        vec3 mid = mix(vec3(1.0, 0.66, 0.72), vec3(0.14, 0.13, 0.34), uNight);

    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uNight, uAspect; uniform vec2 uSun;
      void main(){
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        float l = dot(c, vec3(0.299, 0.587, 0.114));
        c = mix(vec3(l), c, mix(1.3, 1.1, uNight));
        c = mix(c, c * c * (3.0 - 2.0 * c), 0.28);
        vec3 warm = mix(vec3(1.04, 1.0, 0.95), vec3(0.94, 0.97, 1.08), uNight);
        c *= warm;
        c += mix(vec3(0.02, 0.0, 0.03), vec3(0.0, 0.01, 0.04), uNight) * (1.0 - l);
        vec2 d = (vUv - uSun) * vec2(uAspect, 1.0);
        c += mix(vec3(1.0, 0.72, 0.45), vec3(0.3, 0.35, 0.7), uNight) * exp(-length(d) * 2.2) * mix(0.14, 0.05, uNight);
        vec2 v = vUv - 0.5;
        c *= 1.0 - dot(v, v) * 0.65;
        gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
      }`,
  };

  const composerRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: LOW ? 0 : 4 });
  const composer = new EffectComposer(renderer, composerRT);
  composer.addPass(new RenderPass(skyScene, camera));
  const mainPass = new RenderPass(scene, camera);
  mainPass.clear = false;
  composer.addPass(mainPass);
  let gtao = null;

    gtao = new GTAOPass(scene, camera, 1, 1);
    gtao.output = GTAOPass.OUTPUT.Default;
    gtao.blendIntensity = 1.0;
    gtao.updateGtaoMaterial({ radius: 0.9, distanceExponent: 1.6, thickness: 1.2, scale: 1.25, samples: 16, distanceFallOff: 1, screenSpaceRadius: false });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
    const baseRender = gtao.render.bind(gtao);
    gtao.render = (...args) => {
      const vis = aoSkip.map((o) => o.visible);
      aoSkip.forEach((o) => (o.visible = false));
      baseRender(...args);
      aoSkip.forEach((o, i) => (o.visible = vis[i]));
    };
    composer.addPass(gtao);
  }
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.35, 0.55, 0.86);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  const tiltH = new ShaderPass(TiltShader);
  const tiltV = new ShaderPass(TiltShader);
  if (!LOW) composer.addPass(tiltH), composer.addPass(tiltV);
  const grade = new ShaderPass(GradeShader);
  composer.addPass(grade);
  const sunScreen = new V3();

  /* ============================ INTERACTION ============================ */
  const tip = $("tip");
  const bubble = $("bubble");
  let bubbleAnchor = null;
  let bubbleUntil = 0;
  const LINES = {
    owner: "Chào bạn! Vào vườn ngồi chơi với mình nhé.",
    dog: "Gâu! Gâu!",
    cat: "Meo~ ai gọi Mướp đó?",
    chicken: "Cục tác! Có trứng rồi!",
    bunny: "Cà rốt ngon quá…",
    fish: "Bõm!",
    tree: "Gió thổi, hoa rơi.",
    garden: "Rau lớn thêm một chút rồi.",
    house: "Nhà nhỏ, nhưng ấm.",
    lantern: "",
  };
  const clock = new THREE.Clock();
  let now = 0;
  function say(id, anchorFn) {
    const text = LINES[id];

    bubble.textContent = text;
    bubble.hidden = false;

    bubbleAnchor = anchorFn;
    bubbleUntil = now + 2.8;
  }
  const headPos = (obj, up = 0.5) => () => obj.getWorldPosition(new V3()).add(new V3(0, up, 0));

  function interact(id, point) {
    if (!sceneReady) return;
    if (id === "owner") {
      ownerState.waveT = now;
      ownerState.pauseUntil = now + 2.6;
      say(id, headPos(owner.head, 0.6));
      emit("star", owner.head.getWorldPosition(new V3()).add(new V3(0, 0.4, 0)), 6, { size: 0.3, up: 1.2 });
      Sound.sfx("owner");
    } else if (id === "dog") {
      dogState.jump = now;
      say(id, headPos(dog.head, 0.5));
      emit("heart", dog.head.getWorldPosition(new V3()), 4, { size: 0.28 });
      Sound.sfx("dog");
    } else if (id === "cat") {
      catState.wake = now;
      say(id, headPos(cat.head, 0.5));
      emit("heart", cat.head.getWorldPosition(new V3()).add(new V3(0, 0.2, 0)), 6, { size: 0.28 });
      Sound.sfx("cat");
    } else if (id === "chicken") {
      chickens.forEach((c) => (c.jump = now));
      const c = chickens[0];
      say(id, headPos(c.head, 0.4));
      emit("feather", c.g.position.clone().add(new V3(0, 0.4, 0)), 8, { color: 0xffffff, up: 1.0, spread: 1.0, gravity: -1.5, life: 1.2, size: 0.06 });
      // a little egg appears
      const egg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.12), colMat(0xfff4e0));
      egg.position.copy(c.pos).add(new V3(0, 0.08, -0.25));
      egg.castShadow = true;
      egg.userData.born = now;
      scene.add(egg);
      eggs.push(egg);
      Sound.sfx("chicken");
    } else if (id === "bunny") {
      bunny.jump = now;
      say(id, headPos(bunny.g, 0.8));
      emit("heart", bunny.g.position.clone().add(new V3(0, 0.5, 0)), 3, { size: 0.24 });
      Sound.sfx("bunny");
    } else if (id === "fish") {
      fishT = now;
      koi.forEach((k, i) => (k.jump = now + i * 0.25));
      const p = point ? point.clone() : water.position.clone();
      p.y = -0.1;
      emit("drop", p, 10, { color: 0x9fd8ff, emissive: 0x1a3a5a, up: 2.2, spread: 0.9, gravity: -7, life: 0.8, size: 0.08, stagger: 0 });
      say(id, () => water.position.clone().add(new V3(0, 1.2, 0)));
      Sound.sfx("fish");
    } else if (id === "tree") {
      treeT = now;
      for (let i = 0; i < 18; i++) emit("petal", new V3(5.5 + (Math.random() - 0.5) * 5, 5 + Math.random() * 2, -6.3 + (Math.random() - 0.5) * 5), 1, { color: 0xffb3cb, up: 0.2, spread: 1.4, gravity: -0.7, life: 2.6, size: 0.12, stagger: 0 });
      say(id, () => new V3(5.5, 9.2, -6.3));
      Sound.sfx("tree");
    } else if (id === "garden") {
      gardenT = now;
      emit("star", new V3(-5.5, 0.9, 3), 10, { size: 0.3, up: 1, spread: 1.6 });
      say(id, () => new V3(-5.5, 2.0, 3));
      Sound.sfx("garden");
    } else if (id === "house") {
      doorT = now;
      emit("star", new V3(-4.6, 2.4, -3.4), 6, { size: 0.3, up: 1 });
      say(id, () => new V3(-5.5, 7.6, -6));
      Sound.sfx("house");
    } else if (id === "lantern") {
      setNight(!isNight());
      Sound.sfx("lantern");
    }
    suggest(id);
    $("hint").classList.add("faded");
  }
  const eggs = [];

  /* ---------- camera: orthographic diorama, drag to orbit, wheel / pinch to zoom ---------- */
  const TARGET = new V3(0, 0.8, 0);
  const cam = { az: 0.62, el: 0.62, taz: 0.62, tel: 0.62, zoom: 1.15, tzoom: 1.15 };
  {
    const q = new URLSearchParams(location.search);
    if (q.has("zoom")) cam.zoom = cam.tzoom = +q.get("zoom");
    if (q.has("az")) cam.az = cam.taz = +q.get("az");
    if (q.has("tx")) TARGET.set(+q.get("tx"), +q.get("ty") || 1, +q.get("tz") || 0);
  }
  let lastInteract = -10;
  const pointers = new Map();
  let downInfo = null;
  let pinchStart = 0;
  const ndc = new THREE.Vector2();
  const ray = new THREE.Raycaster();
  let hoverDirty = false;
  let lastPointer = { x: 0, y: 0, inside: false };
  let viewH = 26;

  function pick(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(clickRoots, true);
    // prefer creatures over scenery areas
    const order = ["owner", "cat", "dog", "chicken", "bunny", "lantern", "fish", "garden", "tree", "house"];
    let best = null;
    for (const h of hits) {
      let o = h.object;
      while (o && !o.userData.clickId) o = o.parent;
      if (!o) continue;
      const rank = order.indexOf(o.userData.clickId);
      if (!best || rank < best.rank) best = { id: o.userData.clickId, point: h.point, rank };
    }
    return best;
  }
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) downInfo = { x: e.clientX, y: e.clientY, moved: 0, az: cam.taz, el: cam.tel };
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = Math.hypot(a.x - b.x, a.y - b.y) / cam.tzoom;
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    lastPointer = { x: e.clientX, y: e.clientY, inside: true };
    if (pointers.has(e.pointerId)) {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        cam.tzoom = clamp(Math.hypot(a.x - b.x, a.y - b.y) / pinchStart, 0.7, 3);
        lastInteract = now;
      } else if (downInfo) {
        const dx = e.clientX - downInfo.x;
        const dy = e.clientY - downInfo.y;
        downInfo.moved = Math.max(downInfo.moved, Math.hypot(dx, dy));
        if (downInfo.moved > 5) {
          cam.taz = downInfo.az - dx * 0.007;
          cam.tel = clamp(downInfo.el + dy * 0.004, 0.25, 1.15);
          canvas.classList.add("grabbing");
          lastInteract = now;
        }
      }
    } else hoverDirty = true;
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    canvas.classList.remove("grabbing");
    if (downInfo && downInfo.moved <= 5 && pointers.size === 0) {
      const hit = pick(e.clientX, e.clientY);
      if (hit) interact(hit.id, hit.point);
    }
    if (pointers.size === 0) downInfo = null;
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("pointerleave", () => {
    lastPointer.inside = false;
    tip.hidden = true;
    canvas.classList.remove("pointing");
  });
  canvas.addEventListener(
    "wheel",
    (e) => {
      e.preventDefault();
      cam.tzoom = clamp(cam.tzoom * (1 - Math.sign(e.deltaY) * 0.1), 0.7, 3);
      lastInteract = now;
    },
    { passive: false },
  );

  layoutView = function () {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    const open = diary.classList.contains("open");
    let fullW = w;
    let fullH = h;
    let ox = 0;
    if (!isPhone() && open) {
      const shift = diary.offsetWidth + 20;
      fullW = w + shift;
      ox = shift;
      root.style.setProperty("--hint-shift", shift / 2 + "px");
    } else if (isPhone()) {
      fullH = h + (open ? diary.offsetHeight * 0.85 : 110);
      root.style.setProperty("--hint-shift", "0px");
    } else root.style.setProperty("--hint-shift", "0px");
    const aspect = fullW / fullH;
    viewH = Math.max(31, 30 / aspect);
    camera.left = (-viewH * aspect) / 2;
    camera.right = (viewH * aspect) / 2;
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    if (fullW !== w || fullH !== h) camera.setViewOffset(fullW, fullH, ox, 0, w, h);
    else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    const pr = Math.min(window.devicePixelRatio || 1, 1.5);
    composer.setPixelRatio(pr);
    composer.setSize(w, h);
    tiltH.uniforms.uDir.value.set(1 / w, 0);
    tiltV.uniforms.uDir.value.set(0, 1 / h);
    skyMat.uniforms.uAspect.value = w / h;
    grade.uniforms.uAspect.value = w / h;
  };
  window.addEventListener("resize", layoutView);
  diary.addEventListener("transitionend", layoutView);
  sceneReady = true;
  layoutView();
  $("loading").hidden = true;

  /* ============================ LOOP ============================ */
  let night = isNight() ? 1 : 0;
  const SUN_DAY = new THREE.Color(0xffc894);
  const SUN_NIGHT = new THREE.Color(0x8fa2ff);
  const HEMI_SKY_D = new THREE.Color(0xffc6dc);
  const HEMI_SKY_N = new THREE.Color(0x4a4f9a);
  const HEMI_GND_D = new THREE.Color(0x6f7fa8);
  const HEMI_GND_N = new THREE.Color(0x2a2440);
  const swayM = new THREE.Matrix4();
  const swayQ = new THREE.Quaternion();
  const swayE = new THREE.Euler();
  const swayS = new V3();
  const swayP = new V3();

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    now += dt;
    const t = now;

    // day <-> night
    night += ((isNight() ? 1 : 0) - night) * Math.min(1, dt * 1.6);
    sun.intensity = lerp(3.0, 0.5, night);
    sun.color.copy(SUN_DAY).lerp(SUN_NIGHT, night);
    sun.position.set(lerp(-14, 10, night), lerp(14, 18, night), lerp(9, 6, night));
    hemi.intensity = lerp(1.05, 0.55, night);
    hemi.color.copy(HEMI_SKY_D).lerp(HEMI_SKY_N, night);
    hemi.groundColor.copy(HEMI_GND_D).lerp(HEMI_GND_N, night);
    windowMat.emissiveIntensity = night * 2.2;
    skyMat.uniforms.uTime.value = t;
    skyMat.uniforms.uNight.value = night;
    skyMat.uniforms.uOff.value = cam.az * 0.35;
    grade.uniforms.uNight.value = night;
    waterMat.uniforms.uTime.value = t;
    waterMat.uniforms.uNight.value = night;
    scene.fog.color.setRGB(lerp(0.96, 0.12, night), lerp(0.8, 0.11, night), lerp(0.82, 0.26, night));
    bloom.strength = lerp(0.32, 0.95, night);
    bloom.threshold = lerp(0.86, 0.55, night);
    houseGlow.intensity = night * 6;
    lanterns.forEach((l, i) => {
      l.glowMat.emissiveIntensity = 0.35 + night * 3.2 + Math.sin(t * 3 + i) * 0.1 * night;
      l.light.intensity = night * 4;
    });

    fireflies.forEach((f) => {
      const u = f.userData;
      f.position.set(u.x + Math.sin(t * u.sp + u.ph) * 0.8, u.y + Math.sin(t * u.sp * 1.7 + u.ph) * 0.4, u.z + Math.cos(t * u.sp * 1.3 + u.ph) * 0.8);
      f.material.opacity = night * Math.max(0, Math.sin(t * 1.5 + u.ph * 3));
    });

    // ambient motion

    const windAmp = reduceMotion ? 0.02 : 0.08;
    const gardenBoost = 1 + 3 * (1 - smooth(0, 1.5, t - gardenT));
    swayers.forEach((im) => {
      const boost = im === wheatField || im === carrotField ? gardenBoost : 1;
      im.userData.data.forEach((d, i) => {
        swayE.set(Math.sin(t * 1.4 + d.ph) * windAmp * boost, d.rot, Math.cos(t * 1.1 + d.ph) * windAmp * boost);
        swayQ.setFromEuler(swayE);
        swayS.setScalar(d.s * (boost > 1.01 ? 1 + (boost - 1) * 0.04 : 1));
        swayP.set(d.x, d.y, d.z);
        swayM.compose(swayP, swayQ, swayS);
        im.setMatrixAt(i, swayM);
      });
      im.instanceMatrix.needsUpdate = true;
    });
    miniIslands.forEach((m, i) => (m.position.y = m.userData.baseY + Math.sin(t * 0.4 + i * 2) * 0.3));
    const treeBoost = 1 + 4 * (1 - smooth(0, 2, t - treeT));
    petals.forEach((p) => {
      const u = p.userData;
      const k = (t * u.sp * treeBoost * 0.6 + u.ph) % 1;
      p.position.set(TREE.x + u.ox + Math.sin(k * 10 + u.drift) * 0.6, 7.5 - k * 8, TREE.z + u.oz + k * 2);
      p.rotation.set(k * 9, k * 7, k * 5);
      p.visible = k < 0.96 && p.position.y > -0.05;
    });
    smoke.forEach((s, i) => {
      const k = (t * 0.25 + i / smoke.length) % 1;
      s.position.set(-3.5 + Math.sin(k * 5 + i) * 0.3 + k * 0.6, 8.2 + k * 3, -6.5 + k * 0.3);
      s.scale.setScalar(0.3 + k * 0.5);
      s.material.opacity = Math.sin(k * Math.PI) * 0.75;
    });
    // door swings open briefly when the house is tapped
    const dk = t - doorT;
    doorGroup.rotation.y = dk > 0 && dk < 3 ? -Math.sin(Math.min(1, dk / 0.4) * Math.PI * 0.5) * 1.3 * (1 - smooth(2.4, 3, dk)) : 0;

    // characters
    updateOwner(t, dt);
    updateDog(t, dt);
    updateCat(t);
    chickens.forEach((c) => {
      const moving = wander(c, t, dt, { x0: -1, x1: 2.5, z0: 5.5, z1: 8.5 }, 0.6, () => (c.wait = 1 + c.r() * 3));
      const jk = t - c.jump;
      const hop = jk > 0 && jk < 0.5 ? Math.sin((jk / 0.5) * Math.PI) * 0.35 : 0;
      c.g.position.set(c.pos.x, hop, c.pos.z);
      c.rig.position.y = moving ? Math.abs(Math.sin(t * 14)) * 0.03 : 0;
      c.head.rotation.x = !moving && Math.sin(t * 3 + c.r() * 0) > 0.6 ? 0.7 : 0;
      c.wings.forEach((w, i) => (w.rotation.z = hop ? (i ? -1 : 1) * Math.sin(t * 40) * 0.8 : 0));
    });
    {
      const b = bunny;
      const moving = wander(b, t, dt, { x0: -3, x1: -0.2, z0: 4.5, z1: 8 }, 0.9, () => (b.wait = 1.5 + Math.random() * 3));
      const jk = t - b.jump;
      const big = jk > 0 && jk < 0.6 ? Math.sin((jk / 0.6) * Math.PI) * 0.6 : 0;
      b.g.position.set(b.pos.x, Math.max(big, moving ? Math.abs(Math.sin(t * 8)) * 0.18 : 0), b.pos.z);
      b.ears.forEach((e, i) => (e.rotation.x = Math.sin(t * 2 + i) * 0.12 - (moving ? 0.25 : 0)));
    }
    koi.forEach((k) => {
      const boost = 1 + 2.5 * (1 - smooth(0, 2, t - fishT));
      k.ph += dt * k.sp * boost;
      const cx = POND.x0 + pondW / 2 - 0.3;
      const cz = POND.z0 + pondD / 2;
      const jk = t - k.jump;
      const jump = jk > 0 && jk < 0.7 ? Math.sin((jk / 0.7) * Math.PI) * 0.8 : 0;
      k.g.position.set(cx + Math.cos(k.ph) * k.r * 1.2, -0.38 + jump, cz + Math.sin(k.ph) * k.r * 0.9);
      k.g.rotation.y = -k.ph + Math.PI;
      k.g.rotation.x = jump ? -Math.cos((jk / 0.7) * Math.PI) * 0.8 : 0;
      k.tail.rotation.y = Math.sin(t * 9 * boost) * 0.5;
    });
    bees.forEach((b, i) => {
      const s = t * 0.6 + b.ph;
      b.g.position.set(5.5 + Math.sin(s * 1.3) * 4, 2.2 + Math.sin(s * 2.1) * 0.8 + i * 0.4, -2.5 + Math.cos(s) * 3.2);
      b.g.rotation.y = -s * 1.3;
      b.wings.forEach((w, j) => (w.rotation.z = (j ? -1 : 1) * Math.sin(t * 60) * 0.6));
    });
    for (let i = eggs.length - 1; i >= 0; i--) {
      const e = eggs[i];
      const a = now - e.userData.born;
      e.scale.setScalar(Math.min(1, a * 4) * (1 - smooth(8, 9, a)));
      if (a > 9) {
        scene.remove(e);
        eggs.splice(i, 1);
      }
    }

    // particles
    for (let i = fx.length - 1; i >= 0; i--) {
      const o = fx[i];
      const u = o.userData;
      u.age += dt;
      if (u.age < 0) continue;
      o.visible = true;
      const k = u.age / u.life;
      u.v.y += u.g * dt;
      o.position.addScaledVector(u.v, dt);
      if (o.isSprite) {
        o.scale.setScalar(u.size * (0.7 + Math.sin(Math.min(k, 1) * Math.PI) * 0.5));
        u.v.multiplyScalar(0.97);
      } else {
        o.scale.setScalar(u.size);
        o.rotation.x += u.spin * dt;
        o.rotation.y += u.spin * dt;
      }
      o.material.opacity = 1 - smooth(0.65, 1, k);
      if (k >= 1) {
        fxGroup.remove(o);
        o.material.dispose();
        fx.splice(i, 1);
      }
    }

    // camera
    if (!reduceMotion && now - lastInteract > 6 && !downInfo) cam.taz += dt * 0.04;
    cam.az += (cam.taz - cam.az) * Math.min(1, dt * 6);
    cam.el += (cam.tel - cam.el) * Math.min(1, dt * 6);
    cam.zoom += (cam.tzoom - cam.zoom) * Math.min(1, dt * 6);
    const D = 60;
    camera.position.set(TARGET.x + D * Math.cos(cam.el) * Math.sin(cam.az), TARGET.y + D * Math.sin(cam.el), TARGET.z + D * Math.cos(cam.el) * Math.cos(cam.az));
    camera.zoom = cam.zoom;
    camera.updateProjectionMatrix();
    camera.lookAt(TARGET);
    sun.target.position.set(0, 0, 0);

    if (hoverDirty && lastPointer.inside) {
      hoverDirty = false;
      const hit = pick(lastPointer.x, lastPointer.y);
      canvas.classList.toggle("pointing", !!hit);
      if (hit) {
        tip.textContent = NAMES[hit.id];
        tip.hidden = false;
        tip.style.transform = `translate(${lastPointer.x + 14}px, ${lastPointer.y + 16}px)`;
      } else tip.hidden = true;
    }
    if (!bubble.hidden) {
      if (now > bubbleUntil) bubble.hidden = true;
      else if (bubbleAnchor) {
        const p = bubbleAnchor().project(camera);
        const x = (p.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-p.y * 0.5 + 0.5) * window.innerHeight;
        const bw = bubble.offsetWidth;
        const bx = clamp(x - bw / 2, 16, window.innerWidth - bw - 16);
        bubble.style.transform = `translate(${bx}px, ${Math.max(70, y - bubble.offsetHeight - 14)}px)`;
      }
    }

    sunScreen.copy(sun.position).normalize().multiplyScalar(40).add(TARGET).project(camera);
    // keep the sun in the open sky to the upper left, drifting a little as the garden turns
    const sx = clamp(0.1 + (sunScreen.x * 0.5 + 0.5) * 0.06, 0.08, 0.18);
    const sy = isPhone() ? 0.8 : 0.79;
    skyMat.uniforms.uSun.value.set(sx, sy);
    grade.uniforms.uSun.value.set(sx, sy);
    composer.render(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
